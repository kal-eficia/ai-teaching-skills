name: tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and protocol tests (standard library only)
        run: python -W error -m unittest discover -s server/tests -v
      - name: Test again with the official MCP client
        if: matrix.python-version == '3.13'
        run: |
          pip install mcp
          python -m unittest server.tests.test_protocol.OfficialClient -v
